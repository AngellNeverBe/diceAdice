<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>diceAdice</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a14;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #dicePanel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 25, 0.4);
            border: 1px solid #334;
            border-radius: 14px;
            padding: 16px 18px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }
        #dicePanel h3 {
            margin: 0 0 4px 0;
            color: #ffcc66;
            font-size: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        .theme-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .theme-selector span {
            color: #aabbdd;
            font-size: 12px;
            margin-right: 4px;
        }
        .theme-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
            background: #333;
        }
        .theme-btn:hover {
            transform: scale(1.2);
            border-color: #fff;
        }
        .theme-btn.active {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        .theme-btn[data-theme="base"]  { background: #bdc3c7; } /* 基础灰色 */
        .theme-btn[data-theme="red"]    { background: #e74c3c; }
        .theme-btn[data-theme="purple"] { background: #9b59b6; }
        .theme-btn[data-theme="green"]  { background: #2ecc71; }
        .theme-btn[data-theme="orange"] { background: #e67e22; }
        .theme-btn[data-theme="black"]  { background: #2c3e50; }
        .theme-btn[data-theme="blue"]   { background: #3498db; }

        .dice-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .dice-label {
            width: 36px;
            color: #ccddff;
            font-weight: bold;
            font-size: 15px;
            text-align: right;
            flex-shrink: 0;
        }
        .dice-label .icon {
            display: inline-block;
            width: 20px;
            text-align: center;
        }
        .btn-adjust {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #556;
            background: #1a1a2e;
            color: #ccddff;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            line-height: 28px;
            text-align: center;
            transition: all 0.15s;
            flex-shrink: 0;
            padding: 0;
        }
        .btn-adjust:hover {
            background: #2a2a44;
            border-color: #889;
        }
        .btn-adjust:active {
            background: #ff8800;
            color: #000;
            border-color: #ffaa44;
            transform: scale(0.93);
        }
        .btn-adjust.minus {
            color: #ff7777;
        }
        .btn-adjust.plus {
            color: #77ff77;
        }
        .dice-count {
            width: 28px;
            text-align: center;
            color: #ffd700;
            font-weight: bold;
            font-size: 17px;
            flex-shrink: 0;
        }
        .row-divider {
            border: none;
            border-top: 1px solid #222;
            margin: 2px 0;
        }
        #totalInfo {
            text-align: center;
            color: #aabbdd;
            font-size: 12px;
            margin: 2px 0;
        }
        #totalInfo span {
            color: #ffd700;
            font-weight: bold;
            font-size: 15px;
        }
        #btnThrow {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ff8800;
            background: linear-gradient(135deg, #ff6600, #ff8800);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s;
            margin-top: 4px;
        }
        #btnThrow:hover {
            background: linear-gradient(135deg, #ff8800, #ffaa00);
            border-color: #ffaa44;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
            transform: translateY(-1px);
        }
        #btnThrow:active {
            transform: scale(0.95);
            box-shadow: 0 0 8px rgba(255, 136, 0, 0.3);
        }
        #btnThrow:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            background: #333;
            color: #777;
            box-shadow: none;
            transform: none;
        }
        #btnClear {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #444;
            background: transparent;
            color: #889;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        #btnClear:hover {
            background: #1a1a2e;
            color: #ccddff;
            border-color: #666;
        }

        #diceResult {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.9);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 22px;
            font-weight: bold;
            display: none;
            pointer-events: none;
            z-index: 20;
            max-width: 380px;
            line-height: 1.5;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            transition: opacity 0.3s;
        }
        #diceResult .result-list {
            font-size: 16px;
            color: #ddd;
            font-weight: normal;
            margin-bottom: 4px;
        }
        #diceResult .result-total {
            font-size: 28px;
            color: #ffd700;
            text-align: center;
            letter-spacing: 1px;
        }
        #diceResult .result-detail {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 2px 8px;
            margin: 1px 3px;
            font-size: 14px;
            color: #ffcc88;
        }
        #diceResult .result-detail.type-label {
            color: #aaccee;
            font-weight: bold;
            background: transparent;
            padding: 2px 4px;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #8899bb;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }
        #info b {
            color: #ffcc66;
        }

        @media (max-width: 600px) {
            #dicePanel {
                top: 8px;
                left: 8px;
                padding: 10px 12px;
                gap: 4px;
                min-width: 160px;
                border-radius: 10px;
            }
            #dicePanel h3 {
                font-size: 13px;
                margin-bottom: 2px;
            }
            .dice-row {
                gap: 4px;
            }
            .dice-label {
                font-size: 13px;
                width: 28px;
            }
            .btn-adjust {
                width: 26px;
                height: 26px;
                font-size: 15px;
                line-height: 24px;
            }
            .dice-count {
                font-size: 14px;
                width: 22px;
            }
            #btnThrow {
                font-size: 14px;
                padding: 8px;
            }
            #diceResult {
                top: 8px;
                right: 8px;
                font-size: 16px;
                padding: 10px 14px;
                max-width: 240px;
            }
            #diceResult .result-total {
                font-size: 22px;
            }
            #info {
                bottom: 8px;
                left: 8px;
                font-size: 11px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <div id="dicePanel">
        <h3>🎲 骰子配置</h3>
        <!-- 主题选择器（base + 六种彩色） -->
        <div class="theme-selector">
            <span>主题：</span>
            <button class="theme-btn active" data-theme="base" title="基础"></button>
            <button class="theme-btn" data-theme="red" title="红色"></button>
            <button class="theme-btn" data-theme="purple" title="紫色"></button>
            <button class="theme-btn" data-theme="green" title="绿色"></button>
            <button class="theme-btn" data-theme="orange" title="橙色"></button>
            <button class="theme-btn" data-theme="black" title="黑色"></button>
            <button class="theme-btn" data-theme="blue" title="蓝色"></button>
        </div>

        <div class="dice-row" data-dice-type="d20">
            <span class="dice-label"><span class="icon">🔷</span>d20</span>
            <button class="btn-adjust minus" data-action="minus">−</button>
            <span class="dice-count" id="count-d20">1</span>
            <button class="btn-adjust plus" data-action="plus">+</button>
        </div>
        <div class="dice-row" data-dice-type="d12">
            <span class="dice-label"><span class="icon">🔶</span>d12</span>
            <button class="btn-adjust minus" data-action="minus">−</button>
            <span class="dice-count" id="count-d12">0</span>
            <button class="btn-adjust plus" data-action="plus">+</button>
        </div>
        <div class="dice-row" data-dice-type="d10">
            <span class="dice-label"><span class="icon">💠</span>d10</span>
            <button class="btn-adjust minus" data-action="minus">−</button>
            <span class="dice-count" id="count-d10">0</span>
            <button class="btn-adjust plus" data-action="plus">+</button>
        </div>
        <div class="dice-row" data-dice-type="d8">
            <span class="dice-label"><span class="icon">🔸</span>d8</span>
            <button class="btn-adjust minus" data-action="minus">−</button>
            <span class="dice-count" id="count-d8">0</span>
            <button class="btn-adjust plus" data-action="plus">+</button>
        </div>
        <div class="dice-row" data-dice-type="d6">
            <span class="dice-label"><span class="icon">🎯</span>d6</span>
            <button class="btn-adjust minus" data-action="minus">−</button>
            <span class="dice-count" id="count-d6">0</span>
            <button class="btn-adjust plus" data-action="plus">+</button>
        </div>
        <div class="dice-row" data-dice-type="d4">
            <span class="dice-label"><span class="icon">🔺</span>d4</span>
            <button class="btn-adjust minus" data-action="minus">−</button>
            <span class="dice-count" id="count-d4">0</span>
            <button class="btn-adjust plus" data-action="plus">+</button>
        </div>
        <div id="totalInfo">骰子总数：<span id="totalCount">1</span></div>
        <button id="btnThrow">⚡ 投 掷</button>
        <button id="btnClear">清空全部</button>
    </div>

    <div id="diceResult">🎲 ?</div>

    <div id="info">
        ⌨️ 按 <b>空格键</b> 掷骰 | 点击 <b>+/−</b> 调整骰子数量<br>
        最多同时投掷 <b>20</b> 个骰子 · 点击颜色按钮切换骰子主题
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { ConvexHull } from 'three/addons/math/ConvexHull.js';
        import * as CANNON from 'cannon-es';

        // ===================== 主题配置 =====================
        const AVAILABLE_THEMES = ['base', 'red', 'purple', 'green', 'orange', 'black', 'blue'];
        let currentTheme = 'base'; // 默认基础主题

        const JSON_PATH = './models/dice_data.json';

        // 内联默认映射（作为外部 JSON 加载失败的回退）
        const DEFAULT_MAPS = {
            d20: {
                face: {
                    "0": 14, "1": 11, "2": 16, "3": 19, "4": 2, "5": 5, "6": 10, "7": 7, "8": 4, "9": 18,
                    "10": 3, "11": 17, "12": 6, "13": 9, "14": 12, "15": 15, "16": 20, "17": 8, "18": 13, "19": 1
                }
            },
            d12: {
                face: {
                    "0": 8, "1": 8, "2": 8, "3": 2, "4": 2, "5": 2, "6": 7, "7": 7, "8": 7, "9": 4, "10": 4, "11": 4,
                    "12": 10, "13": 10, "14": 10, "15": 12, "16": 12, "17": 12, "18": 3, "19": 3, "20": 3, "21": 9,
                    "22": 9, "23": 9, "24": 1, "25": 1, "26": 1, "27": 6, "28": 6, "29": 6, "30": 11, "31": 11, "32": 11,
                    "33": 5, "34": 5, "35": 5
                }
            },
            d10: {
                face: {
                    "0": 9, "1": 9, "2": 5, "3": 5, "4": 3, "5": 3, "6": 7, "7": 7, "8": 1, "9": 1,
                    "10": 8, "11": 8, "12": 2, "13": 2, "14": 6, "15": 6, "16": 4, "17": 4, "18": 10, "19": 10
                }
            },
            d8: {
                face: { "0": 7, "1": 1, "2": 4, "3": 6, "4": 5, "5": 3, "6": 2, "7": 8 }
            },
            d6: {
                face: {
                    "0": 4, "1": 4, "2": 1, "3": 1, "4": 3, "5": 3, "6": 6, "7": 6, "8": 5, "9": 5, "10": 2, "11": 2
                }
            },
            d4: {
                vertex: { "0": 1, "1": 4, "2": 3, "3": 2 }
            }
        };

        let activeMaps = { ...DEFAULT_MAPS };

        // ===================== 骰子配置 =====================
        const DICE_TYPES = ['d20', 'd12', 'd10', 'd8', 'd6', 'd4'];
        const MAX_TOTAL_DICE = 20;
        const diceConfig = {
            d20: 1,
            d12: 0,
            d10: 0,
            d8: 0,
            d6: 0,
            d4: 0
        };

        function getTotalDiceCount() {
            return Object.values(diceConfig).reduce((a, b) => a + b, 0);
        }

        // ===================== 基础场景 =====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0a0a14');

        const frustumSize = 6;
        let aspect = innerWidth / innerHeight;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2,
            frustumSize * aspect / 2,
            frustumSize / 2,
            frustumSize / -2,
            0.1,
            20
        );
        camera.position.set(0, 5, 0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 光照
        const ambient = new THREE.AmbientLight(0xccddff, 1.0);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffeedd, 5);
        mainLight.position.set(5, 16, -5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 30;
        mainLight.shadow.bias = -0.0005;
        mainLight.shadow.camera.left = -10;
        mainLight.shadow.camera.right = 10;
        mainLight.shadow.camera.top = 10;
        mainLight.shadow.camera.bottom = -10;
        scene.add(mainLight);
        const fillLight = new THREE.DirectionalLight(0xccddff, 0.1);
        fillLight.position.set(-5, 16, 5);
        scene.add(fillLight);

        // 物理世界
        const world = new CANNON.World();
        world.gravity.set(0, -16, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.defaultContactMaterial.restitution = 0.3;
        world.defaultContactMaterial.friction = 0.02;
        world.solver.iterations = 20;

        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        groundBody.position.y = -0.8;
        world.addBody(groundBody);

        // 动态桌面与边框
        let tableMesh, wallMeshes = [], wallBodies = [];

        function buildTableAndWalls() {
            if (tableMesh) scene.remove(tableMesh);
            wallMeshes.forEach(m => scene.remove(m));
            wallBodies.forEach(b => world.removeBody(b));
            wallMeshes = [];
            wallBodies = [];

            const w = frustumSize * aspect;
            const h = frustumSize;

            const tableGeo = new THREE.PlaneGeometry(w, h);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.7 });
            tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.rotation.x = -Math.PI / 2;
            tableMesh.position.y = -0.8;
            tableMesh.receiveShadow = true;
            tableMesh.visible = false;
            scene.add(tableMesh);

            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x334455, roughness: 0.5, transparent: true, opacity: 0.4
            });
            const wallThickness = 2000, wallHeight = 2000, inwardMargin = 0;
            const halfW = w / 2, halfH = h / 2;

            const positions = [
                [0, -0.8 + wallHeight/2, -halfH - wallThickness/2 + inwardMargin, w + wallThickness, wallHeight, wallThickness],
                [0, -0.8 + wallHeight/2,  halfH + wallThickness/2 - inwardMargin, w + wallThickness, wallHeight, wallThickness],
                [-halfW - wallThickness/2 + inwardMargin, -0.8 + wallHeight/2, 0, wallThickness, wallHeight, h + wallThickness],
                [ halfW + wallThickness/2 - inwardMargin, -0.8 + wallHeight/2, 0, wallThickness, wallHeight, h + wallThickness]
            ];

            positions.forEach(([x, y, z, sx, sy, sz]) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), wallMat);
                mesh.position.set(x, y, z);
                mesh.receiveShadow = true;
                mesh.visible = false;
                scene.add(mesh);
                wallMeshes.push(mesh);
                const body = new CANNON.Body({
                    mass: 0,
                    shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2))
                });
                body.position.set(x, y, z);
                world.addBody(body);
                wallBodies.push(body);
            });

            const ceilingY = 4.5, ceilingThickness = 0.2;
            const ceilingGeo = new THREE.BoxGeometry(w + wallThickness, ceilingThickness, h + wallThickness);
            const ceilingMat = new THREE.MeshStandardMaterial({
                color: 0x334455, roughness: 0.5, transparent: true, opacity: 0.2, visible: false
            });
            const ceilingMesh = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceilingMesh.position.set(0, ceilingY, 0);
            ceilingMesh.receiveShadow = true;
            ceilingMesh.visible = false;
            scene.add(ceilingMesh);
            wallMeshes.push(ceilingMesh);
            const ceilingBody = new CANNON.Body({
                mass: 0,
                shape: new CANNON.Box(new CANNON.Vec3(
                    (w + wallThickness) / 2, ceilingThickness / 2, (h + wallThickness) / 2
                ))
            });
            ceilingBody.position.set(0, ceilingY, 0);
            world.addBody(ceilingBody);
            wallBodies.push(ceilingBody);
        }

        // ===================== 模型存储与类型缓存 =====================
        let modelMeshesByName = {};
        let modelsLoaded = false;
        let mapsLoaded = false;
        const typeCache = {};

        function extractGeometryData(geometry) {
            const index = geometry.index;
            const pos = geometry.attributes.position;
            const normals = [];
            const vertices = [];
            const vertSet = new Set();
            const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
            for (let i = 0; i < index.count; i += 3) {
                const i0 = index.getX(i), i1 = index.getX(i+1), i2 = index.getX(i+2);
                a.fromBufferAttribute(pos, i0);
                b.fromBufferAttribute(pos, i1);
                c.fromBufferAttribute(pos, i2);
                const ab = b.clone().sub(a), ac = c.clone().sub(a);
                const normal = new THREE.Vector3().crossVectors(ab, ac).normalize();
                normals.push(normal.clone());
            }
            for (let i = 0; i < pos.count; i++) {
                const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
                const key = `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`;
                if (!vertSet.has(key)) {
                    vertSet.add(key);
                    vertices.push(v);
                }
            }
            return { normals, vertices };
        }

        function createDiceShape(geometry) {
            const posAttr = geometry.attributes.position;
            const vertexSet = new Set();
            const rawVertices = [];
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i), y = posAttr.getY(i), z = posAttr.getZ(i);
                if (isNaN(x) || isNaN(y) || isNaN(z)) continue;
                if (!isFinite(x) || !isFinite(y) || !isFinite(z)) continue;
                const key = `${x.toFixed(4)},${y.toFixed(4)},${z.toFixed(4)}`;
                if (!vertexSet.has(key)) {
                    vertexSet.add(key);
                    rawVertices.push(new THREE.Vector3(x, y, z));
                }
            }
            if (rawVertices.length < 4) {
                console.warn('顶点不足，使用盒体代替');
                return new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5));
            }
            const hull = new ConvexHull();
            hull.setFromPoints(rawVertices);
            const hullFaces = hull.faces;
            const hullVertices = [];
            const vertexMap = new Map();
            const faces = [];
            hullFaces.forEach(face => {
                const faceVerts = [];
                let edge = face.edge;
                do {
                    const v = edge.head().point;
                    const key = `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`;
                    let idx = vertexMap.get(key);
                    if (idx === undefined) {
                        idx = vertexMap.size;
                        vertexMap.set(key, idx);
                        hullVertices.push(v.clone());
                    }
                    faceVerts.push(idx);
                    edge = edge.next;
                } while (edge !== face.edge);
                for (let i = 1; i < faceVerts.length - 1; i++) {
                    faces.push([faceVerts[0], faceVerts[i], faceVerts[i + 1]]);
                }
            });
            const cannonVerts = hullVertices.map(v => new CANNON.Vec3(v.x, v.y, v.z));
            const center = new CANNON.Vec3();
            cannonVerts.forEach(v => center.vadd(v, center));
            center.scale(1 / cannonVerts.length, center);
            const orientedFaces = faces.map(([a, b, c]) => {
                const av = cannonVerts[a], bv = cannonVerts[b], cv = cannonVerts[c];
                const normal = bv.vsub(av).cross(cv.vsub(av));
                const faceCenter = av.vadd(bv).vadd(cv).scale(1/3);
                if (normal.dot(faceCenter.vsub(center)) < 0) {
                    return [c, b, a];
                }
                return [a, b, c];
            });
            return new CANNON.ConvexPolyhedron({
                vertices: cannonVerts,
                faces: orientedFaces
            });
        }

        function buildTypeCache(type, templateMesh) {
            if (typeCache[type]) return;
            const geom = templateMesh.geometry;
            const data = extractGeometryData(geom);
            const shape = createDiceShape(geom);
            const map = activeMaps[type] || DEFAULT_MAPS[type];
            typeCache[type] = { normals: data.normals, vertices: data.vertices, shape: shape, map: map };
            console.log(`[缓存] ${type}: ${data.normals.length} 个三角面`);
        }

        // ===================== 骰子对象管理 =====================
        let diceObjects = [];

        function clearAllDice() {
            diceObjects.forEach(obj => {
                if (obj.body) world.removeBody(obj.body);
                if (obj.mesh) scene.remove(obj.mesh);
            });
            diceObjects = [];
        }

        function getTopResultForDice(diceObj) {
            const { mesh, type } = diceObj;
            const cache = typeCache[type];
            if (!cache) return null;
            const worldUp = new THREE.Vector3(0, 1, 0);
            if (type === 'd4') {
                let maxY = -Infinity, topIdx = -1;
                const matrix = mesh.matrixWorld;
                const verts = cache.vertices;
                for (let i = 0; i < verts.length; i++) {
                    const worldPos = verts[i].clone().applyMatrix4(matrix);
                    if (worldPos.y > maxY) { maxY = worldPos.y; topIdx = i; }
                }
                const num = cache.map.vertex[topIdx];
                return { index: topIdx, num, type };
            } else {
                let maxDot = -1, topIdx = -1;
                const matrix = mesh.matrixWorld;
                const normals = cache.normals;
                for (let i = 0; i < normals.length; i++) {
                    const worldNormal = normals[i].clone().applyMatrix4(matrix);
                    const dot = worldNormal.dot(worldUp);
                    if (dot > maxDot) { maxDot = dot; topIdx = i; }
                }
                const num = cache.map.face[topIdx];
                return { index: topIdx, num, type };
            }
        }

        function getAllDiceResults() {
            const results = [];
            diceObjects.forEach(obj => {
                const res = getTopResultForDice(obj);
                if (res && res.num !== undefined) results.push({ type: res.type, num: res.num });
            });
            const grouped = {};
            results.forEach(r => {
                if (!grouped[r.type]) grouped[r.type] = [];
                grouped[r.type].push(r.num);
            });
            return { results, grouped };
        }

        function showAllResults() {
            const { results, grouped } = getAllDiceResults();
            const div = document.getElementById('diceResult');
            if (results.length === 0) { div.style.display = 'none'; return; }
            const total = results.reduce((s, r) => s + r.num, 0);
            let html = '<div class="result-list">';
            const typeOrder = DICE_TYPES.filter(t => grouped[t] && grouped[t].length > 0);
            typeOrder.forEach(t => {
                const nums = grouped[t];
                html += `<span class="result-detail type-label">${t}:</span>`;
                nums.forEach(n => { html += `<span class="result-detail">${n}</span>`; });
                if (t !== typeOrder[typeOrder.length - 1]) html += ' ';
            });
            html += '</div>';
            html += `<div class="result-total">🎲 总和 = ${total}</div>`;
            div.innerHTML = html;
            div.style.display = 'block';
            return total;
        }

        function hideResults() {
            document.getElementById('diceResult').style.display = 'none';
        }

        // ===================== 骰子排列与重建 =====================
        function arrangeDicePositions(count) {
            if (count === 0) return [];
            const tableW = frustumSize * aspect;
            const tableD = frustumSize;
            const spacingX = Math.min(1.6, (tableW - 1.5) / Math.max(count, 1));
            const spacingZ = 1.5;
            const maxPerRow = Math.max(1, Math.floor((tableW - 1.5) / spacingX));
            const positions = [];
            for (let i = 0; i < count; i++) {
                const row = Math.floor(i / maxPerRow);
                const col = i % maxPerRow;
                const totalInRow = Math.min(maxPerRow, count - row * maxPerRow);
                const startX = -(totalInRow - 1) * spacingX / 2;
                const x = startX + col * spacingX;
                const z = (row - Math.floor((count - 1) / maxPerRow) / 2) * spacingZ;
                positions.push({ x, z, y: -0.3 });
            }
            return positions;
        }

        function rebuildDice() {
            if (!modelsLoaded || !mapsLoaded) return;
            clearAllDice();
            hideResults();
            resultShown = false;
            stableFrames = 0;
            throwTime = 0;
            const totalCount = getTotalDiceCount();
            if (totalCount === 0) { updateUI(); return; }
            const positions = arrangeDicePositions(totalCount);
            let posIndex = 0;
            DICE_TYPES.forEach(type => {
                const count = diceConfig[type];
                if (count <= 0) return;
                const template = modelMeshesByName[type];
                if (!template) return;
                const cache = typeCache[type];
                if (!cache) return;
                for (let i = 0; i < count; i++) {
                    const mesh = template.clone();
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    const body = new CANNON.Body({ mass: 0.2, shape: cache.shape });
                    body.linearDamping = 0.1;
                    body.angularDamping = 0.2;
                    const pos = positions[posIndex] || { x: 0, z: 0, y: -0.3 };
                    body.position.set(pos.x, pos.y, pos.z);
                    body.quaternion.setFromEuler(
                        Math.random() * 0.6 - 0.3,
                        Math.random() * Math.PI * 2,
                        Math.random() * 0.6 - 0.3
                    );
                    body.wakeUp();
                    world.addBody(body);
                    mesh.position.copy(body.position);
                    mesh.quaternion.copy(body.quaternion);
                    scene.add(mesh);
                    diceObjects.push({ mesh, body, type });
                    posIndex++;
                }
            });
            updateUI();
        }

        function updateUI() {
            const totalCount = getTotalDiceCount();
            document.getElementById('totalCount').textContent = totalCount;
            DICE_TYPES.forEach(type => {
                const el = document.getElementById('count-' + type);
                if (el) el.textContent = diceConfig[type];
            });
            const btnThrow = document.getElementById('btnThrow');
            btnThrow.disabled = totalCount === 0;
            btnThrow.textContent = totalCount === 0 ? '请添加骰子' : '按[空格]投掷';
        }

        function adjustDiceCount(type, delta) {
            const newVal = diceConfig[type] + delta;
            if (newVal < 0) return;
            const currentTotal = getTotalDiceCount();
            if (delta > 0 && currentTotal >= MAX_TOTAL_DICE) {
                const totalEl = document.getElementById('totalCount');
                totalEl.style.color = '#ff4444';
                setTimeout(() => { totalEl.style.color = '#ffd700'; }, 300);
                return;
            }
            diceConfig[type] = newVal;
            rebuildDice();
        }

        // ===================== 投掷逻辑 =====================
        let stableFrames = 0;
        const STABLE_THRESHOLD = 35, VEL_EPS = 0.025, ANG_EPS = 0.025, MAX_WAIT_MS = 3500;
        let throwTime = 0, resultShown = false;

        function throwAllDice() {
            if (diceObjects.length === 0) return;
            hideResults();
            resultShown = false;
            stableFrames = 0;
            throwTime = performance.now();
            const tableW = frustumSize * aspect;
            const tableD = frustumSize;
            diceObjects.forEach((obj) => {
                const x = (Math.random() - 0.5) * (tableW / 3.5);
                const y = Math.random() / 5 + 0.2;
                const z = (Math.random() - 0.5) * (tableD / 3.5);
                obj.body.position.set(x, y, z);
                obj.body.quaternion.setFromEuler(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );
                obj.body.velocity.set(
                    (Math.random() - 0.5) * 4,
                    Math.random() + 0.5,
                    (Math.random() - 0.5) * 4
                );
                obj.body.angularVelocity.set(
                    (Math.random() / 2 + 1) * 8,
                    (Math.random() / 2 + 1) * 4,
                    (Math.random() / 2 + 1) * 8
                );
                obj.body.wakeUp();
            });
        }

        // ===================== 资源加载与主题切换 =====================
        async function loadExternalMaps() {
            try {
                const response = await fetch(JSON_PATH);
                if (!response.ok) throw new Error('JSON 加载失败');
                const json = await response.json();
                if (json && typeof json === 'object') {
                    DICE_TYPES.forEach(t => {
                        if (json[t]) activeMaps[t] = json[t];
                    });
                }
                console.log('✅ 已加载外部映射文件:', JSON_PATH);
            } catch (err) {
                console.warn('⚠️ 外部映射加载失败，使用内联默认映射:', err.message);
                activeMaps = { ...DEFAULT_MAPS };
            } finally {
                mapsLoaded = true;
                if (modelsLoaded) rebuildDice();
            }
        }

        function loadModels(theme) {
            return new Promise(async (resolve, reject) => {
                try {
                    const glbPath = `./models/dices_${theme}.glb`;
                    const response = await fetch(glbPath);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const buf = await response.arrayBuffer();
                    const glb = new Uint8Array(buf);

                    // --- 从 GLB 中提取图片并预解码为 ImageBitmap ---
                    const dv = new DataView(buf);
                    const jsonLen = dv.getUint32(12, true);
                    const gltfJson = JSON.parse(new TextDecoder().decode(glb.slice(20, 20+jsonLen)));
                    let binOff = 0;
                    if (20+jsonLen < buf.byteLength) {
                        const cLen = dv.getUint32(20+jsonLen, true);
                        const cType = dv.getUint32(20+jsonLen+4, true);
                        if (cType === 0x004E4942) binOff = 20+jsonLen+8;
                    }
                    const bitmaps = {};
                    if (gltfJson.images && binOff>0) {
                        for (let i=0; i<gltfJson.images.length; i++) {
                            const img = gltfJson.images[i];
                            if (img.bufferView!==undefined) {
                                const bv = gltfJson.bufferViews[img.bufferView];
                                const bytes = glb.slice(binOff+bv.byteOffset, binOff+bv.byteOffset+bv.byteLength);
                                try {
                                    const bmp = await createImageBitmap(new Blob([bytes],{type:img.mimeType||'image/png'}));
                                    bitmaps[i] = bmp;
                                } catch(e) { /* 该纹理无法解码，跳过 */ }
                            }
                        }
                    }

                    // --- GLTFLoader解析 ---
                    const loader = new GLTFLoader();
                    loader.parse(buf, '', (gltf) => {
                        // 构建纹理数组：textureIndex → {imageIndex, sampler}
                        const gltfTexArr = (gltfJson.textures||[]).map(tex => ({source:tex.source, sampler:tex.sampler}));

                        // 遍历所有mesh，根据GLTF JSON精确替换纹理
                        gltf.scene.traverse((node) => {
                            if (!node.isMesh || !node.material) return;
                            const mats = Array.isArray(node.material) ? node.material : [node.material];
                            // 在gltfJson中找到对应material定义
                            const gltfMats = gltfJson.materials||[];
                            // 通过名称匹配（大多数情况下只有一个material定义）
                            mats.forEach(mat => {
                                // 尝试匹配每个GLTF material定义
                                gltfMats.forEach(gltfMat => {
                                    const pbr = gltfMat.pbrMetallicRoughness||{};
                                    const slotMap = {
                                        map: pbr.baseColorTexture,
                                        roughnessMap: pbr.metallicRoughnessTexture,
                                        metalnessMap: pbr.metallicRoughnessTexture,
                                        normalMap: gltfMat.normalTexture,
                                        emissiveMap: gltfMat.emissiveTexture,
                                        aoMap: gltfMat.occlusionTexture
                                    };
                                    Object.entries(slotMap).forEach(([slot, texRef]) => {
                                        if (!texRef) return;
                                        const imgIdx = gltfTexArr[texRef.index]?.source;
                                        if (imgIdx!==undefined && bitmaps[imgIdx]) {
                                            const t = new THREE.Texture(bitmaps[imgIdx]);
                                            // map(颜色贴图)→sRGB，法线/粗糙度/金属度→线性空间
                                            t.colorSpace = (slot === 'map') ? THREE.SRGBColorSpace : THREE.NoColorSpace;
                                            t.needsUpdate = true;
                                            mat[slot] = t;
                                        }
                                    });
                                });
                            });
                        });

                        const allMeshes = [];
                        gltf.scene.traverse(c => { if (c.isMesh) allMeshes.push(c); });
                        modelMeshesByName = {};
                        allMeshes.forEach(mesh => {
                            const name = mesh.name.trim();
                            if (DICE_TYPES.includes(name) && !modelMeshesByName[name]) {
                                modelMeshesByName[name] = mesh;
                            }
                        });
                        Object.keys(typeCache).forEach(k => delete typeCache[k]);
                        DICE_TYPES.forEach(type => {
                            if (modelMeshesByName[type]) buildTypeCache(type, modelMeshesByName[type]);
                        });
                        modelsLoaded = true;
                        resolve();
                    }, (err) => { console.error('解析失败:', err); reject(err); });
                } catch(err) { console.error('加载失败:', err); reject(err); }
            });
        }

        // 防重入标志
        let isSwitchingTheme = false;

        async function switchTheme(newTheme) {
            if (isSwitchingTheme) return;
            if (newTheme === currentTheme) return;

            const themeBtns = document.querySelectorAll('.theme-btn');
            const throwBtn = document.getElementById('btnThrow');

            isSwitchingTheme = true;
            // 禁用所有主题按钮和投掷按钮
            themeBtns.forEach(b => b.disabled = true);
            throwBtn.disabled = true;

            try {
                clearAllDice();
                modelsLoaded = false;
                modelMeshesByName = {};

                await loadModels(newTheme);
                currentTheme = newTheme;

                // 更新按钮激活状态
                themeBtns.forEach(b => {
                    b.classList.toggle('active', b.dataset.theme === newTheme);
                });

                if (mapsLoaded) {
                    rebuildDice();
                }
            } catch (err) {
                alert(`无法加载主题”${newTheme}”的模型文件，请确保 models/dices_${newTheme}.glb 存在。`);
                // 尝试回退到之前主题
                if (currentTheme !== newTheme) {
                    try {
                        await loadModels(currentTheme);
                        modelsLoaded = true;
                        if (mapsLoaded) rebuildDice();
                    } catch (e) {
                        console.error('回退主题也失败了', e);
                    }
                }
            } finally {
                // 无论成功与否，恢复按钮状态
                themeBtns.forEach(b => {
                    b.disabled = false;
                    // 确保激活状态与当前主题匹配
                    b.classList.toggle('active', b.dataset.theme === currentTheme);
                });
                throwBtn.disabled = (getTotalDiceCount() === 0);
                isSwitchingTheme = false;
            }
        }

        // ===================== 事件绑定 =====================
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                if (theme && AVAILABLE_THEMES.includes(theme)) {
                    switchTheme(theme);
                }
            });
        });

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && diceObjects.length > 0) {
                e.preventDefault();
                throwAllDice();
            }
        });

        document.getElementById('dicePanel').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            if (btn.classList.contains('theme-btn')) return; // 主题按钮已单独处理
            if (btn.id === 'btnThrow') {
                if (diceObjects.length > 0) throwAllDice();
                return;
            }
            if (btn.id === 'btnClear') {
                DICE_TYPES.forEach(t => { diceConfig[t] = 0; });
                rebuildDice();
                return;
            }
            const row = btn.closest('.dice-row');
            if (!row) return;
            const type = row.dataset.diceType;
            const action = btn.dataset.action;
            if (!type || !action) return;
            if (action === 'plus') adjustDiceCount(type, 1);
            if (action === 'minus') adjustDiceCount(type, -1);
        });

        renderer.domElement.addEventListener('dblclick', () => {
            if (diceObjects.length > 0) throwAllDice();
        });

        function onResize() {
            aspect = innerWidth / innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            buildTableAndWalls();
            if (modelsLoaded && mapsLoaded && !resultShown && getTotalDiceCount() > 0) {
                const positions = arrangeDicePositions(getTotalDiceCount());
                let posIdx = 0;
                diceObjects.forEach(obj => {
                    if (posIdx < positions.length) {
                        const p = positions[posIdx];
                        obj.body.position.set(p.x, p.y, p.z);
                        obj.body.wakeUp();
                        posIdx++;
                    }
                });
                stableFrames = 0;
                throwTime = 0;
            }
        }
        window.addEventListener('resize', onResize);
        buildTableAndWalls();

        // ===================== 渲染循环 =====================
        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60);
            diceObjects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
                const limitX = (frustumSize * aspect) / 2 - 0.2;
                const limitZ = frustumSize / 2 - 0.2;
                obj.body.position.x = Math.max(-limitX, Math.min(limitX, obj.body.position.x));
                obj.body.position.z = Math.max(-limitZ, Math.min(limitZ, obj.body.position.z));
                obj.body.position.y = Math.max(-0.7, obj.body.position.y);
            });
            if (diceObjects.length > 0 && !resultShown) {
                let allSlow = true, maxVel = 0, maxAng = 0;
                diceObjects.forEach(obj => {
                    const vel = obj.body.velocity.length();
                    const ang = obj.body.angularVelocity.length();
                    if (vel > maxVel) maxVel = vel;
                    if (ang > maxAng) maxAng = ang;
                    if (vel >= VEL_EPS || ang >= ANG_EPS) allSlow = false;
                });
                const now = performance.now();
                const timeoutReached = (throwTime > 0) && (now - throwTime > MAX_WAIT_MS);
                if (allSlow) stableFrames++;
                else stableFrames = 0;
                const shouldStop = !resultShown && (stableFrames >= STABLE_THRESHOLD || (timeoutReached && maxVel < 0.15 && maxAng < 0.15));
                if (shouldStop) {
                    const total = showAllResults();
                    if (total !== undefined) {
                        console.log(`[停稳] ${diceObjects.length}个骰子 → 总和 ${total}  (${(now - throwTime).toFixed(0)}ms)`);
                    }
                    resultShown = true;
                    stableFrames = 0;
                    throwTime = 0;
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        // 启动：先加载映射，再加载默认主题模型
        loadExternalMaps();
        loadModels(currentTheme).then(() => {
            if (mapsLoaded) rebuildDice();
        });

        console.log('🎲 骰子桌面已启动（默认主题：base）');
    </script>
</body>
</html>
